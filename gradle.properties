# Run the Gradle daemon (and thus the Kotlin compiler daemon) on JDK 21 (LTS).
# Only non-LTS Java 26 is on PATH locally, and the Kotlin 2.1 compiler does not support running
# on Java 26. Point Gradle at the Foojay-provisioned Temurin 21 so builds are reproducible.
# CI sets up JDK 21 directly, so this local override is harmless there (paths differ) — CI
# relies on the toolchain/actions-provided JDK instead and does not read this file's path.
org.gradle.java.installations.auto-download=true
