name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so git-based tests have commits to work with

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build + unit tests + deterministic integration test. Never calls Claude.
      - name: Build and test
        run: ./gradlew build :integration-tests:integrationTest --no-daemon

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: bisectai-jar
          path: cli/build/libs/bisectai-*.jar
