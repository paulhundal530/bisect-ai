name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and package
        run: ./gradlew build :integration-tests:integrationTest :cli:shadowJar --no-daemon

      - name: Attach runnable JAR to the release
        uses: softprops/action-gh-release@v2
        with:
          files: cli/build/libs/bisectai-*.jar
